# Rebuilds the per-set tables (tools/pipeline) when 17Lands publishes new or
# updated public datasets, and uploads them to the `set-data` pre-release
# that the overlay downloads from. New sets get their table within a day of
# 17Lands releasing the data (~2–3 weeks after the set launches).
name: Set data

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      sets:
        description: 'Set codes (space-separated); empty = the 8 newest'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the datasets are unchanged'
        type: boolean
        default: false

permissions:
  contents: write   # upload release assets

concurrency:
  group: set-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Pinned to commits (tags can be moved); bump deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The pipeline uses only Node built-ins — no npm install needed.
      - name: Build and publish changed set tables
        # Inputs go through env vars, never interpolated into the script
        # (avoids shell injection); update-sets.js validates set codes too.
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET_CACHE: ${{ runner.temp }}/datasets
          SETS: ${{ inputs.sets }}
          FORCE: ${{ inputs.force }}
        run: |
          set -f
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          for s in $SETS; do args+=("$s"); done
          node tools/pipeline/update-sets.js "${args[@]}"
